[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcclass"
version = "0.1.0"
description = "Dataset generation for classifying flattened quantum circuits by the algorithm they implement."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "qiskit",
    "qiskit-qasm3-import",
    "mqt.bench>=2,<3",
    "numpy",
    "pandas",
    "pyarrow",  # required by pandas to write the F3 Parquet file
    "pyyaml",
    "networkx",
    "scikit-learn",
    "torch",
    "torch-geometric",
    "tqdm",
    "psutil",  # RAM measurements (qcclass medir)
    "mlflow>=3.18,<4",  # tracking server (m1pro) and client
    "optuna>=5.1,<6",  # the gRPC storage proxy is experimental: stay on one major version
    "grpcio",  # Optuna gRPC storage proxy (server and clients)
    "python-dotenv",  # per-machine .env
    "typer",
    "matplotlib",  # notebooks and figures
    "pylatexenc",  # Qiskit "mpl" circuit drawer
    "scipy",  # Procrustes alignment of the demo traces
    "pydantic>=2.14,<3",  # data contract of QTaggerDemo (esquema/demo/)
    "jsonschema",  # validation of the demo export against its JSON Schema
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "nbformat", "nbclient", "ipykernel"]

[project.scripts]
qcclass = "qcclass.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running integration tests (deselect with -m 'not slow')"]
filterwarnings = [
    # raised by torch_geometric at import time (torch.jit.script is deprecated in torch 2.15)
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
