# Phase 11b: provisional export for QTaggerDemo (qcclass exportar-demo --provisional).
# Model: the phase 11 reference on block 0, retrained in its own MLflow experiment
# (demo_referencia.yaml). Only the train + val pool of `aleatorio` and a circuit generated on
# the spot are used; never test, never the unknown set. Everything is marked provisional;
# phase 18 replaces it with the final models and a gallery from test.

nombre: demo_provisional
semilla: 42
salida: exports/demo/provisional       # relative to the repository root

modelo:
  experimento: configs/experimentos/demo_referencia.yaml
  bloque: 0
  directorio: null                     # null = newest finished run of the experiment on the
                                       # block with its model and epochs (results/gnn/...)

galeria:                               # 'etiquetada' variants of the held-out groups of the block
  principal: {algoritmo: grover, cubits: [3, 4]}   # small Grover: 3-4 search qubits; the
                                       # smallest one predicted correctly
  candidatos:                          # every gallery circuit: trainable class (never a
    min_puertas: 20                    # reserved or family-only algorithm), F2 gates in range
    max_puertas: 1500
  legibilidad:                         # family circuits (and the error): readable in the demo
    max_cubits: 10
    min_puertas: 30
    max_puertas: 400
    puertas_objetivo: 120              # the closest to it (ties: id); correctly predicted first
  algoritmos_por_familia:              # restrict the algorithm shown for a family
    oraculos: [dj, bv]                 # Grover is already the main circuit
  # Fallback when no candidate of a family is readable: the candidate of that family closest
  # to puertas_objetivo, ignoring the readability limits (the reason says so).
  columnas_por_rango: true             # a gate occupies every qubit between its lowest and
                                       # highest one in the drawings (as its box or CX line)
  aleatorio:                           # the "unknown" example, generated now with a fixed
    cubits: 4                          # seed derived from `semilla` (stored in its JSON)
    profundidad: 8
    max_operandos: 2

explicacion:
  pasos: 64                            # integrated gradients, midpoint Riemann sum

desconocidos:
  aceptacion: 0.95                     # threshold: accepts 95 % of the known held-out circuits

limites:                               # guide per circuit (a warning above them)
  json_mb: 2
  binario_mb: 5
