# Split protocols. Every protocol is created once with this seed and is not regenerated
# unless explicitly forced.

semilla: 42
aleatorio: {train: 0.70, val: 0.15, test: 0.15}        # fractions of group_id, must sum to 1
por_tamano: {train: [3, 16], val: [17, 20], test: [21, 30]}  # inclusive qubit ranges, disjoint
por_nivel: {train: [alg, indep], test: [nativegates, mapped]}   # levels, deduplicated together
algoritmos_reservados: [qwalk, hrs_cumulative_multiplier, hhl]   # never seen in training
minimo_por_clase_train: 15   # unique base circuits (group_id) per class in train

# Class balancing, applied to every class when the splits are built (no circuit is deleted).
balanceo:
  modo: muestreo              # muestreo: sample at most max_bases_por_clase bases per class
                              # ponderacion: keep every base, export per-class loss weights
  max_bases_por_clase: null   # null = median of unique bases per class over the classes
                              # not in variacionales_con_parametros
